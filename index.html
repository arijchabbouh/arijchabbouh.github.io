<title>FixIt Soutenance IHM</title>
<meta name="description" content="Présentation zoomable de FixIt : utilisateurs et personas, storyboards, arbre des tâches décoré avec opérateurs UAN, démarche et évaluation.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600;700&display=swap">
<style>
/* Concept : une carte zoomable. Le fond est l'écran de l'app (vert forêt) ; les diapos sont des cartes claires posées dessus.
   Plan général → partie (tuile) → diapo, comme un zoom de caméra. Palette tirée de l'app FixIt. */
:root{
  --forest:#1F2E2B; --forest2:#172320; --forest3:#2A3C38; --mist:#A9BDB7; --snow:#EAF2EF;
  --mint:#7FBFB3; --mintd:#2B7A6C; --mintl:#E1F0EC;
  --paper:#F5F7F3; --card:#FFFFFF; --ink:#1C2A27; --mut:#5A6763; --line:#D5DDD8;
  --amber:#E2A33C; --amberd:#8E560A; --amberl:#FBEFD9;
  --leaf:#6FA046; --leafl:#E7F2DC; --red:#C2483B; --redl:#F8E2DE; --sys:#EBEFEC;
  --fd:'Bitter',Georgia,'Times New Roman',serif;
  --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --fh:'Caveat','Segoe Print','Comic Sans MS',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--forest2);color:var(--snow);font-family:var(--fb)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--mint);outline-offset:3px}
#vp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--forest) 0,var(--forest2) 70%);touch-action:none}
#vp::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(127,191,179,.13) 1.5px,transparent 1.5px);background-size:34px 34px;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.66,0,.3,1)}
@media (prefers-reduced-motion:reduce){#world{transition:none!important}}

/* ---------- Plan général ---------- */
.band{position:absolute;left:0;top:0;width:4040px;height:560px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 40px 40px}
.band .logo{display:flex;align-items:center;gap:40px}
.band .mark{width:190px;height:190px;border-radius:52px;background:var(--mint);display:grid;place-items:center}
.band h1{font:800 230px/0.9 var(--fd);margin:0;color:var(--snow);letter-spacing:-4px}
.band .sub{font-size:58px;color:var(--mist);margin-top:18px}
.band .team{text-align:right;font-size:44px;color:var(--mist);line-height:1.45}
.band .team b{color:var(--snow);display:block;font-size:52px}
.tile{position:absolute;width:1920px;height:1080px;border-radius:64px;background:var(--forest);border:3px solid var(--forest3);box-shadow:0 40px 90px rgba(0,0,0,.35);cursor:pointer;transition:border-color .3s}
.tile:hover,.tile.cur{border-color:var(--mint)}
.tile>.num{position:absolute;left:92px;top:40px;font:800 250px/1 var(--fd);color:var(--mint);letter-spacing:-6px}
.tile>h2{position:absolute;left:470px;top:92px;margin:0;font:800 100px/1 var(--fd);color:var(--snow);letter-spacing:-1.5px}
.tile>.tdesc{position:absolute;left:474px;top:214px;width:1350px;font-size:36px;color:var(--mist);line-height:1.3}
.mini{position:absolute;border-radius:8px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.35);outline:0 solid var(--mint);transition:outline-width .2s}
.mini:hover{outline-width:6px}
.mini .slide{transform-origin:0 0}
.mlab{position:absolute;font-size:24px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlab b{color:var(--mint);font-family:var(--fm);margin-right:10px}
.mini.cur{outline:0}
.mini:not(.cur) .slide{pointer-events:none}
.mini:not(.cur){cursor:pointer}

/* ---------- Diapo ---------- */
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--paper);color:var(--ink);overflow:hidden;padding:64px 88px 56px;display:flex;flex-direction:column;gap:26px;font-size:24px;line-height:1.35}
.slide h2{font:800 64px/1.04 var(--fd);margin:0;letter-spacing:-.5px;text-wrap:balance}
.slide h3{font:800 32px/1.15 var(--fd);margin:0}
.slide p{margin:0}
.k{font:700 19px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mintd);margin-bottom:12px}
.lead{font-size:27px;color:var(--mut);max-width:1500px;margin-top:12px}
.mutd{color:var(--mut)}
.sfoot{position:absolute;right:56px;bottom:22px;font:600 17px var(--fm);color:var(--mut)}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:24px 28px;min-width:0}
.row{display:flex;gap:24px;min-height:0}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.fill{flex:1;min-height:0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;font-size:19px;font-weight:700;background:var(--sys);color:var(--ink);white-space:nowrap}
.chip.m{background:var(--mintl);color:var(--mintd)}
.chip.a{background:var(--amberl);color:var(--amberd)}
.chip.r{background:var(--redl);color:var(--red)}
.chip.d{background:var(--forest);color:var(--snow)}
.go{border:0;background:var(--mintl);color:var(--mintd);font-weight:700;font-size:19px;border-radius:99px;padding:5px 14px}
.go:hover{background:var(--mint);color:var(--forest)}
.mono{font-family:var(--fm)}
ul.l{margin:0;padding-left:26px}
ul.l li{margin-bottom:6px}
table.t{border-collapse:collapse;width:100%;font-size:21px}
table.t th{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 14px;border-bottom:2px solid var(--ink)}
table.t td{padding:10px 14px;border-bottom:1.5px solid var(--line);vertical-align:top}
table.t tr.g td{background:var(--forest);color:var(--snow);font:700 16px var(--fb);letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border:0}
table.t td.dec{color:var(--mintd);font-weight:600}

/* Personas */
.pers{display:grid;grid-template-columns:560px 1fr;gap:34px;height:100%}
.pid{background:var(--forest);color:var(--snow);border-radius:34px;padding:34px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.pid .ph{display:flex;gap:24px;align-items:center}
.pid .ph svg{width:220px;height:220px;flex-shrink:0}
.pid h3{font:800 58px/1 var(--fd);color:var(--snow)}
.pid .seg{font-size:20px;color:var(--mint);font-weight:700;margin-top:10px}
.pid dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0;font-size:21px}
.pid dt{color:var(--mist)}
.pid dd{margin:0;font-weight:600}
.pid .ctx{font-size:21px;color:#D5E3DF;border-top:1.5px solid var(--forest3);padding-top:16px}
.pid .tr{display:flex;flex-wrap:wrap;gap:8px}
.pid .tr span{border:1.5px solid var(--mint);color:var(--mint);border-radius:99px;padding:3px 13px;font-size:18px;font-weight:700}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:start;min-width:0}
.pq{grid-column:1/-1;font:italic 700 34px/1.25 var(--fd);color:var(--ink);padding:6px 0 4px 26px;border-left:8px solid var(--mint)}
.pb{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px 24px;min-width:0}
.pb h4{margin:0 0 10px;font:700 17px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mintd)}
.pb ul{margin:0;padding-left:24px;font-size:21px}
.pb li{margin-bottom:5px}
.pb.full{grid-column:1/-1}
.pb.impl{background:var(--mintl);border-color:var(--mint)}
.pb.impl ul{columns:2;column-gap:40px}
.pb.fr li::marker{color:var(--red)}
.bar{display:grid;grid-template-columns:230px 1fr 64px;align-items:center;gap:12px;font-size:19px;font-weight:600;margin-bottom:9px}
.bar .tk{height:13px;border-radius:7px;background:var(--sys);overflow:hidden}
.bar .tk i{display:block;height:100%;border-radius:7px;background:var(--mintd)}
.bar.a .tk i{background:var(--amber)}
.bar b{text-align:right;font-family:var(--fm);font-size:18px}
.dots{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:12px;font-size:19px;font-weight:600;margin-top:6px}
.dots span{letter-spacing:6px;color:var(--mintd);font-size:22px}

/* Storyboards */
.sbh{display:flex;gap:26px;align-items:center}
.sbh .av{width:128px;height:128px;flex-shrink:0}
.sbh .acts{margin-left:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.acts .three{display:flex;gap:8px;align-items:center;font-size:18px;color:var(--mut);font-weight:600}
.acts .three i{font-style:normal;color:var(--mintd)}
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:22px 24px;flex:1;min-height:0}
.pnl{display:flex;flex-direction:column;min-height:0;background:var(--card);border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.scn{position:relative;flex:1;min-height:0;border-bottom:3px solid var(--ink);overflow:hidden}
.scn svg{position:absolute;inset:0;width:100%;height:100%}
.ptag{position:absolute;left:12px;top:12px;background:var(--red);color:#fff;font:700 15px var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:6px}
.pn{position:absolute;left:12px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 22px var(--fd)}
.emo{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 12px 2px 3px;font:700 16px var(--fb)}
.emo svg{position:static;width:34px;height:34px}
.cap{font:700 28px/1.12 var(--fh);color:var(--ink);padding:9px 16px 11px;min-height:86px}

/* Arbres */
.tbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:19px}
.tbar .sp{flex:1}
.sc{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 15px;font-weight:700;font-size:18px}
.sc[aria-pressed="true"]{background:var(--forest);color:var(--snow);border-color:var(--forest)}
.tl{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:17px}
.tl b{font-family:var(--fm);color:var(--mintd);font-size:18px}
.tarea{flex:1;min-height:0;position:relative}
.tarea>svg{width:100%;height:100%;display:block}
.tn{cursor:pointer}
.tn .bx{fill:#fff;stroke:var(--line);stroke-width:2}
.tn.comp .bx{stroke:var(--ink);stroke-width:2.4}
.tn.sys .bx{fill:var(--sys)}
.tn.opt .bx{stroke-dasharray:8 6}
.tn.cut .bx{fill:var(--mintl);stroke:var(--mintd)}
.tn .st{fill:var(--mintd)}
.tn.r-con .st{fill:var(--amber)}
.tn.r-adm .st{fill:var(--ink)}
.tn.r-all .st{fill:var(--mist)}
.tn text{font-family:var(--fb);fill:var(--ink)}
.tn .nm{font-size:16.5px;font-weight:600}
.tn.comp .nm,.tn.cut .nm{font-weight:700}
.tn .id{font:600 13px var(--fm);fill:var(--mut)}
.tn .star{font:800 26px var(--fb);fill:var(--red)}
.tn .bd rect{fill:var(--ink)}.tn.sys .bd rect{fill:var(--mut)}
.tn .bd text{fill:#fff;font:700 11px var(--fm)}
.tn .dc{font:600 12.5px var(--fm);fill:var(--mut)}
.tn .dc .h{fill:var(--red)}.tn .dc .m{fill:var(--amberd)}.tn .dc .f{fill:var(--leaf)}
.tn .lk{font:700 13px var(--fb);fill:var(--mintd)}
.tn:hover .bx{stroke:var(--mintd);stroke-width:3}
.tn.sel .bx{stroke:var(--mintd);stroke-width:4}
.tn.hl .bx{fill:var(--amberl);stroke:var(--amberd);stroke-width:3}
.tn .pb2 circle{fill:var(--amberd)}.tn .pb2 text{fill:#fff;font:800 14px var(--fb)}
.ed{fill:none;stroke:var(--mut);stroke-width:2}
.op rect{fill:var(--paper);stroke:var(--mintd);stroke-width:1.6}
.op text{font:600 15px var(--fm);fill:var(--mintd)}
.pop{position:absolute;right:0;top:0;width:560px;max-height:100%;overflow:auto;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 rgba(28,42,39,.12);padding:22px 26px;font-size:19px;z-index:5}
.pop .x{position:absolute;right:14px;top:12px;border:0;background:var(--sys);border-radius:50%;width:40px;height:40px;font-size:22px;line-height:1}
.pop h3{font-size:28px;margin:4px 46px 6px 0}
.pop .uan{font:500 16px/1.4 var(--fm);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;word-break:break-word}
.pop .dg{display:grid;grid-template-columns:170px 1fr;border-top:1.5px solid var(--line)}
.pop .dg>div{padding:6px 0;border-bottom:1.5px solid var(--line)}
.pop .dg .kk{color:var(--mut);font-weight:700;font-size:16px;padding-right:10px}
.pop .ih{font-size:14px;color:var(--mut);font-style:italic}
.lvH{color:var(--red);font-weight:800}.lvM{color:var(--amberd);font-weight:800}.lvF{color:var(--leaf);font-weight:800}

/* App mock */
.app{width:430px;height:860px;border-radius:56px;background:#1E2B28;border:10px solid #0E1513;color:#EAF2EF;position:relative;padding:58px 24px 24px;font-family:var(--fb);box-shadow:0 30px 60px rgba(28,42,39,.25);flex-shrink:0}
.app .nt{position:absolute;left:50%;top:0;transform:translateX(-50%);width:150px;height:34px;background:#0E1513;border-radius:0 0 22px 22px}
.app .tm{position:absolute;left:28px;top:28px;font-weight:700;font-size:15px}
.app .lg{position:absolute;right:20px;top:20px;display:flex;background:#16211F;border-radius:99px;padding:3px}
.app .lg span{padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;color:#A9BDB7}
.app .lg span.on{background:#24332F;color:var(--mint)}
.app h4{font:700 30px/1.1 var(--fd);margin:14px 0 8px}
.app .s{font-size:17px;color:#BFD0CB;line-height:1.35}
.app .cta{margin:22px 0 26px;background:#7FBFB3;color:#14201D;border-radius:18px;padding:18px;text-align:center;font-weight:700;font-size:18px}
.app .sec{font-size:14px;letter-spacing:.12em;font-weight:700;color:#9DB2AC;margin-bottom:6px}
.app .it{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #2C3D39;align-items:flex-start}
.app .ic{width:46px;height:46px;border-radius:12px;background:#24332F;flex-shrink:0;display:grid;place-items:center}
.app .it b{font-size:17px;display:block}
.app .it small{font-size:14px;color:#A9BDB7}
.app .bg{margin-left:auto;font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.app .bg.a{background:#3B2B12;color:#E2A33C}.app .bg.g{background:#1F3320;color:#8CC26A}
.app .hist{margin-top:20px;background:#16211F;border-radius:16px;padding:16px;text-align:center;font-weight:700;font-size:16px}
.pin{position:absolute;width:42px;height:42px;border-radius:50%;background:var(--amber);color:var(--forest);font:800 22px var(--fd);display:grid;place-items:center;border:3px solid var(--forest);z-index:3}
.ann{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.ann .n{width:42px;height:42px;border-radius:50%;background:var(--amber);color:var(--forest);font:800 22px var(--fd);display:grid;place-items:center}
.ann p{font-size:21px}
.ann small{display:block;font:600 15px var(--fm);color:var(--mut);margin-top:2px}

/* ---------- Barre de navigation ---------- */
#nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(23,35,32,.92);border:1.5px solid var(--forest3);border-radius:99px;padding:6px;z-index:20;transition:opacity .4s;max-width:calc(100% - 24px)}
#nav.hide{opacity:0;pointer-events:none}
#nav button{border:0;background:transparent;color:var(--snow);border-radius:99px;min-width:44px;height:44px;padding:0 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#nav button:hover{background:var(--forest3)}
#nav .lab{font-size:14px;color:var(--mist);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#nav .lab b{color:var(--mint);font-family:var(--fm);margin-right:6px}
#nav .pr{display:flex;gap:4px;padding:0 6px}
#nav .pr i{width:8px;height:8px;border-radius:50%;background:var(--forest3)}
#nav .pr i.on{background:var(--mint)}
#hint{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:14px;color:var(--mist);background:rgba(23,35,32,.85);padding:6px 14px;border-radius:99px;z-index:20;transition:opacity .4s;white-space:nowrap}
#hint.hide{opacity:0}
@media (max-width:640px){#nav .lab{max-width:34vw}#nav .pr{display:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1C2A27" stroke-width="1.4" opacity=".18"/></pattern>
    <pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#DDE9EA"/><path d="M34 0V34H0" fill="none" stroke="#C3D4D6" stroke-width="2"/></pattern>
  </defs>
</svg>

<div id="vp"><div id="world"></div></div>
<div id="hint">Cliquez sur une partie ou appuyez sur → pour commencer</div>
<nav id="nav" aria-label="Navigation de la présentation">
  <button type="button" id="nHome" aria-label="Plan général">Plan</button>
  <button type="button" id="nPrev" aria-label="Précédent">◀</button>
  <span class="lab" id="nLab" aria-live="polite"></span>
  <span class="pr" id="nPr"></span>
  <button type="button" id="nNext" aria-label="Suivant">▶</button>
  <button type="button" id="nFull" aria-label="Plein écran">⛶</button>
</nav>

<script>
/* =====================================================================
   1. PERSONNAGES DESSINÉS
   ===================================================================== */
const K="#1C2A27";
const CH={
  salma:{n:"Salma",f:1,skin:"#EDB993",hair:"#2A1A14",hs:"long",shirt:"#7FBFB3",ear:1},
  youssef:{n:"Youssef",skin:"#C68A60",hair:"#171717",hs:"curly",shirt:"#E2A33C",stub:1},
  amine:{n:"Amine",skin:"#D9A37C",hair:"#3A2416",hs:"short",shirt:"#4C6A93",gl:"round"},
  hedi:{n:"Hédi",skin:"#C08058",hair:"#A3A39E",hs:"grey",shirt:"#6FA046",must:1,gl:"rect"},
  rania:{n:"Rania",f:1,skin:"#E3AE88",hair:"#5A3A26",hs:"bun",shirt:"#2B7A6C",head:1}
};
const MOOD={
  neutral:{b:["M72 70 L90 68","M110 68 L128 70"],e:"dot",m:"M88 112 Q100 118 112 112"},
  happy:{b:["M72 68 Q81 61 90 66","M110 66 Q119 61 128 68"],e:"dot",m:"M84 108 Q100 128 116 108 Z",mf:1},
  relief:{b:["M72 67 Q81 63 90 66","M110 66 Q119 63 128 67"],e:"closed",m:"M84 108 Q100 126 116 108 Z",mf:1},
  worried:{b:["M72 71 L90 63","M110 63 L128 71"],e:"dot",m:"M87 118 Q93 111 100 116 Q107 121 113 114"},
  stressed:{b:["M72 72 L90 61","M110 61 L128 72"],e:"big",m:"M89 116 Q100 108 111 116 Q100 122 89 116Z",mf:1,sw:1},
  focus:{b:["M72 66 L90 71","M110 71 L128 66"],e:"small",m:"M90 114 L110 114"},
  angry:{b:["M71 63 L92 73","M108 73 L129 63"],e:"small",m:"M86 119 Q100 108 114 119"},
  surprised:{b:["M72 63 Q81 56 90 61","M110 61 Q119 56 128 63"],e:"big",m:"o"},
  proud:{b:["M72 67 Q81 61 90 65","M110 65 Q119 61 128 67"],e:"closed",m:"M86 109 Q102 124 118 106"}
};
const MW={neutral:["serein","sereine"],happy:["content","contente"],relief:["soulagé","soulagée"],worried:["inquiet","inquiète"],stressed:["stressé","stressée"],focus:["concentré","concentrée"],angry:["agacé","agacée"],surprised:["surpris","surprise"],proud:["fier","fière"]};
function face(c,mood){
  const C=CH[c],M=MOOD[mood||"neutral"];let s="";
  const sk=`stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  if(C.hs==="long")s+=`<path d="M50 94 C38 34 162 34 150 94 C156 128 162 158 168 190 C132 172 68 172 32 190 C38 158 44 128 50 94Z" fill="${C.hair}" ${sk}/>`;

SECTIONS.forEach(s=>s.slides.forEach(x=>{if(!SLIDETITLE[x.id])SLIDETITLE[x.id]=x.t;}));
TREES["3-1"]={root:"2.1.1.1",title:"",lead:"",sel:"2.1.1.1"};

/* =====================================================================
   5. MONDE ZOOMABLE
   ===================================================================== */
const world=document.getElementById("world");
const TILEPOS=[[0,640],[2120,640],[0,1920],[2120,1920]];
const OVER={x:-140,y:-40,w:4320,h:3080};
const BOX={},STOPS=["over"],STOPSEC={over:-1};
let html=`<div class="band"><div class="logo"><div class="mark"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#14201D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></div><div><h1>FixIt</h1><div class="sub">Diagnostiquer et réparer soi-même, pas à pas · Module IHM</div></div></div><div class="team"><b>Nour Bribech · Arij Chabbouh · Emna Thouabtia</b>ENICarthage · Conception centrée utilisateur</div></div>`;
SECTIONS.forEach((sec,si)=>{
  const [tx,ty]=TILEPOS[si];BOX["t"+(si+1)]={x:tx-20,y:ty-20,w:1960,h:1120};STOPS.push("t"+(si+1));STOPSEC["t"+(si+1)]=si;
  const n=sec.slides.length,cols=n<=6?3:(n<=8?4:3),rows=Math.ceil(n/cols),g=30,lab=44,areaW=1728,areaH=680;
  const s=Math.min((areaW-(cols-1)*g)/cols/1920,(areaH-(rows-1)*g-rows*lab)/rows/1080),mw=1920*s,mh=1080*s;
  const gx=96+(areaW-(cols*mw+(cols-1)*g))/2,gy=352;
  html+=`<div class="tile" data-stop="t${si+1}" style="left:${tx}px;top:${ty}px"><div class="num">${sec.n}</div><h2>${sec.title}</h2><p class="tdesc">${sec.desc}</p>`;
  sec.slides.forEach((sl,i)=>{const c=i%cols,r=Math.floor(i/cols),x=gx+c*(mw+g),y=gy+r*(mh+g+lab);
    BOX[sl.id]={x:tx+x,y:ty+y,w:mw,h:mh};STOPS.push(sl.id);STOPSEC[sl.id]=si;
    html+=`<div class="mini" data-stop="${sl.id}" style="left:${x}px;top:${y}px;width:${mw}px;height:${mh}px"><div class="slide" id="sl-${sl.id}" style="transform:scale(${s})">${sl.html()}${sl.bare?"":""}<span class="sfoot">${sl.id.replace("-",".")} · FixIt</span></div></div><div class="mlab" style="left:${x}px;top:${y+mh+8}px;width:${mw}px"><b>${sl.id.replace("-",".")}</b>${sl.t}</div>`;});
  html+=`</div>`;
});
world.innerHTML=html;
BOX.over=OVER;

/* Arbres interactifs */
const treeState={};
function renderTree(id){const c=TREES[id],el=document.querySelector(`#sl-${id} .tarea`);if(!el)return;const st=treeState[id]||(treeState[id]={sel:c.sel,path:null,pop:false});
  cfgSlideOf=id;el.innerHTML=drawTree(BY[c.root],{maxD:c.maxD,cut:c.cut,link:c.link,sel:st.sel,path:st.path?c.paths[st.path]:[]})+(st.pop?`<div class="pop">${decoHTML(st.sel)}</div>`:"");}
Object.keys(TREES).forEach(renderTree);
document.addEventListener("click",e=>{
  const sl=e.target.closest(".slide");const cur=e.target.closest(".mini.cur");
  if(cur){
    const tn=e.target.closest(".tn");const ta=e.target.closest(".tarea");
    if(tn&&ta){const id=ta.dataset.tree;treeState[id].sel=tn.dataset.n;treeState[id].pop=true;renderTree(id);return;}
    if(e.target.closest("[data-close]")){const ta2=e.target.closest(".tarea");treeState[ta2.dataset.tree].pop=false;renderTree(ta2.dataset.tree);return;}
    const pb=e.target.closest("[data-path]");if(pb){const sid=sl.id.slice(3);const st=treeState[sid];st.path=st.path===pb.dataset.path?null:pb.dataset.path;st.pop=false;renderTree(sid);sl.querySelectorAll("[data-path]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.path===st.path));return;}
    const g=e.target.closest("[data-go]");if(g){goStop(STOPS.indexOf(g.dataset.go));return;}
    const nd=e.target.closest("[data-node]");if(nd){openNode(nd.dataset.node);return;}
    return;
  }
  const st=e.target.closest("[data-stop]");if(st&&!moved){goStop(STOPS.indexOf(st.dataset.stop));}
});
function openNode(nid){let target=NODESLIDE(nid)||"3-3";if(!BY[nid])return;const st=treeState[target];
  st.sel=nid;st.pop=true;renderTree(target);goStop(STOPS.indexOf(target));}

/* Caméra */
let idx=0,timer=null;
function cam(box,dur){const vw=innerWidth,vh=innerHeight,pad=box===OVER?1:1;const S=Math.min(vw/box.w,vh/box.h)*pad;
  const tx=(vw-box.w*S)/2-box.x*S,ty=(vh-box.h*S)/2-box.y*S;world.style.transitionDuration=(dur??1000)+"ms";world.style.transform=`translate(${tx}px,${ty}px) scale(${S})`;}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function goStop(i,instant){
  if(i<0||i>=STOPS.length)return;const from=STOPS[idx],to=STOPS[i];idx=i;clearTimeout(timer);
  document.querySelectorAll(".cur").forEach(x=>x.classList.remove("cur"));
  const el=document.querySelector(`[data-stop="${to}"]`);if(el)el.classList.add("cur");
  const sa=STOPSEC[from],sb=STOPSEC[to];
  if(!instant&&!reduce&&from!=="over"&&to!=="over"&&sa!==sb){cam(OVER,800);timer=setTimeout(()=>cam(BOX[to],950),820);}
  else cam(BOX[to],instant||reduce?0:(to==="over"||from==="over"?1050:900));
  updNav();try{history.replaceState(null,"","#"+(to==="over"?"plan":"d"+to));}catch(e){}
  document.getElementById("hint").classList.toggle("hide",to!=="over");
}
function updNav(){const to=STOPS[idx],si=STOPSEC[to];let lab;
  if(to==="over")lab="<b>FixIt</b>Plan général";
  else if(to[0]==="t"){const s=SECTIONS[si];lab=`<b>${s.n}</b>${s.title}`;}
  else{const s=SECTIONS[si];lab=`<b>${to.replace("-",".")}</b>${SLIDETITLE[to]} · ${s.title}`;}
  document.getElementById("nLab").innerHTML=lab;
  document.getElementById("nPr").innerHTML=SECTIONS.map((s,i)=>`<i class="${i===si?"on":""}" title="${s.title}"></i>`).join("");}
const next=()=>goStop(idx<STOPS.length-1?idx+1:0),prev=()=>goStop(Math.max(0,idx-1));
function up(){const to=STOPS[idx];if(to==="over")return;if(to[0]==="t")goStop(0);else goStop(STOPS.indexOf("t"+(STOPSEC[to]+1)));}
document.getElementById("nNext").onclick=next;document.getElementById("nPrev").onclick=prev;document.getElementById("nHome").onclick=()=>goStop(0);
document.getElementById("nFull").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){}};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)&&!(e.key==="Enter"&&e.target.closest("button"))){e.preventDefault();next();}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==="Escape"){up();}else if(e.key==="Home"){goStop(0);}else if(e.key==="f"||e.key==="F"){document.getElementById("nFull").click();}});
addEventListener("resize",()=>cam(BOX[STOPS[idx]],0));
/* Glisser pour naviguer sur écran tactile */
let sx=null,moved=false;
addEventListener("pointerdown",e=>{sx=[e.clientX,e.clientY];moved=false;});
addEventListener("pointermove",e=>{if(sx&&Math.hypot(e.clientX-sx[0],e.clientY-sx[1])>12)moved=true;});
addEventListener("pointerup",e=>{if(!sx)return;const dx=e.clientX-sx[0],dy=e.clientY-sx[1];if(e.pointerType==="touch"&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():prev();}sx=null;setTimeout(()=>moved=false,0);});
/* Barre de navigation discrète */
let hideT;const nav=document.getElementById("nav");
function wake(){nav.classList.remove("hide");clearTimeout(hideT);hideT=setTimeout(()=>{if(STOPS[idx]!=="over")nav.classList.add("hide");},2600);}
addEventListener("pointermove",wake);addEventListener("keydown",wake);
/* Démarrage */
const h=(location.hash||"").slice(1);let start=0;if(h.startsWith("d")&&STOPS.includes(h.slice(1)))start=STOPS.indexOf(h.slice(1));else if(STOPS.includes(h))start=STOPS.indexOf(h);
goStop(start,true);wake();
</script>
